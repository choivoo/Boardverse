name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      # validates wrangler.toml + bundles the Worker WITHOUT deploying or needing any Cloudflare credentials
      - run: npx wrangler deploy --dry-run --outdir /tmp/cf-out
