name: Deploy to Cloudflare (manual)
# Never runs automatically. Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Workers + Durable Objects edit rights).
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Ship the Stockfish (GPL-3.0) analysis engine? Set to 0 until the licence has been reviewed."
        default: "1"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit && npm test
      - run: npm run build
        env: { VITE_ENGINE: "${{ inputs.engine }}" }
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
